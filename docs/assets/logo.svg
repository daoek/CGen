<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512" style="color:#1B2A3A" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Connector click logo</title>
  <g fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" transform="translate(0 7)">
    <!-- Header: housing, cavity, locking ramp -->
    <path fill-rule="evenodd" d="M62 44 H70 L80 39 V44 H112 V96 H62 Z M62 52 H102 V88 H62 Z"/>
    <!-- Wire-side housing: rear flange, body, single-block nose -->
    <rect x="16" y="46" width="6" height="48"/>
    <rect x="22" y="50" width="34" height="40"/>
    <rect x="56" y="56" width="40" height="28"/>
    <!-- Latch: bridge, thick arm with raised thumb tab, chamfered hook behind the ramp -->
    <rect x="42" y="34" width="10" height="16"/>
    <path d="M22 17 L34 25 H91 V37 L88 40 H84 V35 H22 Z"/>
  </g>
  <!-- Click -->
  <g stroke="currentColor" stroke-width="5" stroke-linecap="round" transform="translate(0 7)">
    <line x1="98" y1="28" x2="105" y2="21"/>
    <line x1="100" y1="37" x2="109" y2="37"/>
  </g>
</svg>
